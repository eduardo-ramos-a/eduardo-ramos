    <main class="main">
      <section class="hero">
      <h1>Contacto</h1>
      <p>Si tienes alguna pregunta, propuesta o solo quieres saludar, rellena el formulario y me pondré en contacto contigo lo antes posible.
    </p>
      <form action="#" method="POST">
      <fieldset>
      <legend>Contacta conmigo</legend>
    
      <div>
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="name" placeholder="John Doe..." required>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="jane@smith.com" required>
    </div>

    <div>
    <label for="subject">Asunto:</label>
    <input type="text" id="subject" name="subject" placeholder="Saludos!" required>
    </div>

    <div>
      <label for="message">Mensaje:</label>
      <textarea name="message" id="message" cols="30" rows="10" placeholder="Hola, me gustaría contactar..." required></textarea>
    </div>


      <div>
      <button type="submit">Enviar</button>
      <button type="reset">Limpiar formulario</button>
    </div>
      </fieldset>
      </form>
    </section>

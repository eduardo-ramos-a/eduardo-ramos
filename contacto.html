      href="https://res.cloudinary.com/imgxivac/image/upload/v1793272735/profile-pic.jpg"
      type="image/x-icon"
    />

  <body>
    <header>
      <nav>
        <a href="index.html" class="logo"><strong>ER</strong></a>

        <ul class="nav-links">
          <li><a href="index.html#sobre-mi">Sobre mi</a></li>

        </ul>

        <button class="hamburger" aria-label="Menú de navegación">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>

    <main>
      <section class="contact-section">
        <h1>Contacto</h1>
        <p class="contact-intro">
          Si tienes alguna pregunta, propuesta o solo quieres saludar, rellena el formulario y me pondré en contacto contigo lo antes posible.
        </p>

        <form action="#" method="POST">
          <fieldset>
            <legend>Contacta conmigo</legend>

            <div class="form-group">
              <label for="name">Nombre:</label>
              <input type="text" id="name" name="name" placeholder="John Doe..." required />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" placeholder="jane@smith.com" required />
            </div>

            <div class="form-group">
              <label for="subject">Asunto:</label>
              <input type="text" id="subject" name="subject" placeholder="Saludos!" required />
            </div>

            <div class="form-group">
              <label for="message">Mensaje:</label>
              <textarea name="message" id="message" cols="30" rows="10" placeholder="Hola, me gustaría contactar..." required></textarea>
            </div>

            <div class="form-buttons">
              <button type="submit" class="btn btn-primary">Enviar</button>
              <button type="reset" class="btn btn-primary">Limpiar formulario</button>
            </div>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Eduardo Ramos - Fullstack Developer student &amp; QA Tester</p>
    </footer>
  </body>
</html>
